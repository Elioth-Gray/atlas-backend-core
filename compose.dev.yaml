# Development: docker compose -f compose.dev.yaml up   -> REST http://localhost:3333, gRPC localhost:9090
# Stop:        docker compose -f compose.dev.yaml down  (add -v to also wipe the database)
# Reads .env (copy .env.example first); "environment" below overrides what must differ inside the container
name: atlas-backend-dev

services:
  api:
    build:
      context: .
      target: dev
    # Build on every up, so changed dependencies or config never run stale (unchanged steps come from cache)
    pull_policy: build
    ports:
      - '3333:8080' # REST (frontend)
      - '9090:9090' # gRPC (other backends)
    # Only the Go source is mounted for hot reload; go.mod, modules and .air.toml come from the image
    volumes:
      - ./cmd:/app/cmd
      - ./internal:/app/internal
      - ./migrations:/app/migrations
      - ./gen:/app/gen
      # Compiler cache, so a recreated container does not rebuild everything from scratch
      - gobuild:/root/.cache/go-build
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      HTTP_HOST: ''
      HTTP_PORT: '8080'
      GRPC_HOST: ''
      GRPC_PORT: '9090'
      DATABASE_URL: postgres://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@db:5432/${POSTGRES_DB:-atlas}?sslmode=disable
      DB_AUTO_MIGRATE: 'true'
      # Python AI service. Defaults to the fakeai stub below; point DOCKER_AI_GRPC_ADDR in .env
      # at the real service (e.g. host.docker.internal:50051) when it runs.
      AI_GRPC_ADDR: ${DOCKER_AI_GRPC_ADDR:-fakeai:50051}
    depends_on:
      db:
        condition: service_healthy

  # Deterministic stand-in for the Python AI service (cmd/fakeai), so the feedback worker and
  # the consultation flow work without it. Set FAKEAI_DELAY (e.g. 3s) to simulate slow turns.
  fakeai:
    build:
      context: .
      target: dev
    pull_policy: build
    command: ['go', 'run', './cmd/fakeai']
    volumes:
      - ./cmd:/app/cmd
      - ./gen:/app/gen
      - gobuild:/root/.cache/go-build
    environment:
      FAKEAI_ADDR: ':50051'
      FAKEAI_DELAY: ${FAKEAI_DELAY:-0s}

  db:
    # PostgreSQL 17 with the pgvector extension (opinion embeddings)
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    ports:
      # 5433 on the host so it does not clash with a locally installed PostgreSQL on 5432
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Web UI to browse and edit the dev database (like Prisma Studio): http://localhost:8081
  dbviewer:
    image: sosedoff/pgweb:0.16.2
    command: ['pgweb', '--bind=0.0.0.0', '--listen=8081', '--skip-open']
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@db:5432/${POSTGRES_DB:-atlas}?sslmode=disable
    ports:
      - '8081:8081'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  gobuild:
